name: hr-nautica-prod

services:
  app:
    image: ${ERP_IMAGE:?ERP_IMAGE deve apontar para uma imagem imutavel por SHA}
    restart: unless-stopped
    env_file:
      - ${ERP_ENV_FILE:-/etc/hr-nautica/production.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_STRICT_MODE: "true"
      DATABASE_SSL_MODE: disable
      DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
      AUTH_COOKIE_SECURE: "false"
      AUDIT_CLEANUP_ENABLED: "false"
    networks:
      - edge
      - database
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  proxy:
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ${ERP_ENV_FILE:-/etc/hr-nautica/production.env}
    ports:
      - "${ERP_HTTPS_BIND_IP:-192.168.100.180}:${ERP_HTTPS_PORT:-8444}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    # Precisa aceitar o DNAT da porta publicada; somente o proxy publica porta.
    driver: bridge
    internal: false
  database:
    external: true
    name: supabase_default

volumes:
  caddy_data:
  caddy_config:
