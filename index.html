<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Náutica ERP</title><link rel="stylesheet" href="/css/new-erp.css"></head><body>
<div id="login-overlay" class="login-overlay"><form id="login-form" class="login-card"><span class="brand-mark">HR</span><h1>HR Náutica</h1><p>Entre para acessar o ERP</p><label>Usuário<input id="login-username" autocomplete="username" required></label><label>Senha<input id="login-password" type="password" autocomplete="current-password" required></label><p id="login-error" class="error hidden"></p><button>Entrar</button></form><form id="change-password-form" class="login-card hidden"><h1>Defina sua senha</h1><label>Senha atual<input id="current-password" type="password" required></label><label>Nova senha<input id="new-password" type="password" required></label><label>Confirmar<input id="confirm-password" type="password" required></label><p id="change-password-error" class="error hidden"></p><button>Salvar senha</button></form></div>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><span class="brand-mark">HR</span><div><strong>HR Náutica</strong><small>ERP Industrial</small></div></div><nav><button data-page="products" class="active">Produtos</button><button data-page="stock">Estoque Geral</button><button data-page="steps">Etapas de Produção</button><button data-page="suppliers">Fornecedores</button></nav><div class="sidebar-footer"><span id="current-user"></span><button id="logout">Sair</button></div></aside><main><header><div><small>BASE OPERACIONAL</small><h1 id="page-title">Produtos</h1><p id="page-subtitle">Cadastro mestre e estrutura dos produtos.</p></div><div id="page-actions"></div></header><div id="notice" class="notice hidden"></div><section id="content"></section></main></div>
<dialog id="modal"><form method="dialog" id="modal-form"><div class="modal-head"><div><small id="modal-kicker"></small><h2 id="modal-title"></h2></div><button value="cancel" class="icon-button">×</button></div><div id="modal-body"></div><div class="modal-actions"><button value="cancel" class="secondary">Cancelar</button><button id="modal-save" value="default">Salvar</button></div></form></dialog>
<script src="/release.js"></script><script src="/js/new-bootstrap.js"></script></body></html>
