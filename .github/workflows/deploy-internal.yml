name: Test and deploy internal ERP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hr-nautica-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: APP_COMMIT_SHA="$GITHUB_SHA" npm run build
      - name: Verify frontend release metadata
        run: test "$(node -p "require('./dist/release.json').release")" = "$GITHUB_SHA"

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: [self-hosted, linux, x64, hr-nautica-production]
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Build immutable application image
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: docker build --pull --build-arg APP_COMMIT_SHA="$RELEASE_SHA" --label "org.opencontainers.image.revision=$RELEASE_SHA" --tag "hr-nautica-pcp:$RELEASE_SHA" .
      - name: Deploy and verify exact SHA
        env:
          RELEASE_SHA: ${{ github.sha }}
          ERP_ENV_FILE: /etc/hr-nautica/production.env
          ERP_DEPLOY_STATE_DIR: /var/lib/hr-nautica-deploy
          ERP_IMAGE_REPOSITORY: hr-nautica-pcp
          ERP_HEALTHCHECK_URL: https://erp.hrnautica.internal
        run: bash scripts/deploy/deploy-production.sh "$RELEASE_SHA"
